<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jiu Chen — Systems &amp; High-Performance Computing</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" sizes="any">

  <script src="theme-preference.js?v=20261121-5"></script>
  <link rel="stylesheet" href="theme-switch.css?v=20261123-2">
  <link rel="stylesheet" href="cover.css?v=20261123-4">
  <link rel="stylesheet" href="scroll-scene.css?v=20261123-1">
  <link rel="stylesheet" href="research-story.css?v=20261121-2">
  <script>
    {
      const scene = document.documentElement.dataset.theme === "dark" ? "dusk" : "daylight";
      const size = matchMedia("(width <= 760px)").matches ? "-mobile" : "";
      const preload = document.createElement("link");
      preload.rel = "preload";
      preload.as = "image";
      preload.href = `assets/coast-${scene}${size}.webp`;
      document.head.append(preload);
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #e7eef3;
      --bg-soft: #dfe8ef;
      --bg-sunk: #d6e2eb;
      --ink: #19212c;
      --ink-soft: #3f4b59;
      --ink-mute: #566475;
      --ink-faint: #6b7786;
      --rule: rgba(25, 33, 44, 0.14);
      --rule-soft: rgba(25, 33, 44, 0.07);
      --accent: #0066cc;
      --accent-bg: rgba(0, 102, 204, 0.08);
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, system-ui, sans-serif;
      --display: "Iowan Old Style", Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --page-width: 1200px;
      --page-gutter: 48px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --bg: var(--dark-canvas, #121212);
      --bg-soft: color-mix(in srgb, var(--bg), CanvasText 5%);
      --bg-sunk: color-mix(in srgb, var(--bg), black 10%);
      --ink: CanvasText;
      --ink-soft: #c7cbd1;
      --ink-mute: #a0a9b5;
      --ink-faint: #8491a1;
      --rule: rgba(230, 239, 255, 0.16);
      --rule-soft: rgba(230, 239, 255, 0.08);
      --accent: #2997ff;
      --accent-bg: rgba(41, 151, 255, 0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    strong { color: var(--ink); font-weight: 600; }
    ::selection { background: var(--accent-bg); color: var(--ink); }
    img { display: block; }

    .page {
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr);
      gap: 80px;
      max-width: var(--page-width);
      margin-inline: auto;
      padding: var(--controls-clearance) var(--page-gutter) 96px;
    }

    .rail {
      position: sticky;
      top: var(--controls-clearance);
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .rail-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    .rail-mark .avatar {
      flex: none;
      inline-size: 40px;
      block-size: 40px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: var(--bg-soft);
      object-fit: cover;
      object-position: center 18%;
    }

    .rail-block-label {
      margin-bottom: 8px;
      color: var(--ink-mute);
      font-size: 12px;
      font-weight: 500;
    }

    .rail-nav,
    .rail-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .rail-nav a,
    .rail-links a {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 20px;
      transition: color 160ms var(--ease-out);
    }

    .rail-nav a { padding-block: 6px; }
    .rail-nav a:hover, .rail-nav a.active, .rail-links a:hover { color: var(--accent); }
    .rail-nav a.active { font-weight: 600; }
    .rail-links { gap: 4px; }
    .rail-links a { display: inline-flex; align-items: center; gap: 6px; }
    .rail-links a::after { content: "↗"; color: var(--ink-faint); font-size: 11px; }
    .rail-stamp { color: var(--ink-mute); font-size: 12px; }

    .content { min-width: 0; }
    .s-title {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
    }

    section.s {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--rule);
      scroll-margin-top: var(--controls-clearance);
    }

    .content > section.s:first-child { margin-top: 0; }

    .s-title {
      margin-bottom: 20px;
      font-size: clamp(32px, 3.6vw, 44px);
      line-height: 1.14;
      letter-spacing: -0.02em;
    }

    html[lang="zh-CN"] .s-title {
      letter-spacing: 0;
    }

    .s-body p {
      max-width: 68ch;
      margin: 0 0 16px;
      color: var(--ink-soft);
    }

    .s-body p.lead {
      max-width: 62ch;
      font-size: 18px;
      color: var(--ink);
    }

    .research-grid { margin-top: 24px; }

    .research-cell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
      gap: 24px;
      padding: 20px 0;
      border-top: 1px solid var(--rule);
    }

    .research-cell:last-child { border-bottom: 1px solid var(--rule); }

    .research-cell h3,
    .pub-body h3,
    .proj-head h3,
    .exp-body h3 {
      margin: 0;
      color: var(--ink);
      font-weight: 600;
      line-height: 1.35;
    }

    .research-cell h3 { font-size: 17px; }
    .research-cell p { margin: 0; font-size: 15px; }

    .s-body .publication-note {
      margin-bottom: 16px;
      color: var(--ink-mute);
      font-size: 13px;
    }

    .pub,
    .exp,
    .edu,
    .award {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 24px;
      padding: 20px 0;
      border-top: 1px solid var(--rule);
    }

    .pub:last-child,
    .exp:last-child,
    .edu:last-child,
    .award:last-child,
    .proj:last-child { border-bottom: 1px solid var(--rule); }

    .pub-meta,
    .exp-when,
    .award .y {
      color: var(--ink-mute);
      font: 400 12px/1.6 var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .pub-meta .y { display: block; color: var(--ink); }
    .pub-body h3, .proj-head h3 { font-size: 20px; }
    .pub-body .authors { margin: 8px 0 4px; font-size: 14px; }
    .pub-body .venue { margin: 0 0 8px; color: var(--ink-mute); font-size: 13px; }

    .pub-links, .proj-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      font-size: 14px;
      font-weight: 500;
    }

    .proj {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      padding: 24px 0;
      border-top: 1px solid var(--rule);
    }

    .proj-text { min-width: 0; }
    .proj p { margin: 8px 0 0; font-size: 15px; }
    .proj-links { margin-top: 8px; }

    .proj-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-top: 8px;
      color: var(--ink-mute);
      font: 400 12px/1.6 var(--mono);
    }

    .proj-stack span + span::before {
      margin-inline-end: 8px;
      content: "·";
    }

    .proj-anim {
      overflow: hidden;
      height: 160px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: var(--bg-soft);
    }

    .proj-svg { display: block; width: 100%; height: 100%; }

    .exp-body h3 { font-size: 17px; }
    .exp-title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    .exp-tag { color: var(--ink-mute); font-size: 12px; }
    .exp-body .where { margin: 4px 0 8px; color: var(--ink-mute); font-size: 14px; }
    .exp-body p { margin: 0; font-size: 15px; }

    .edu { grid-template-columns: 112px minmax(0, 1fr) 52px; }
    .edu-watermark {
      display: grid;
      place-items: center;
      align-self: center;
      width: 52px;
      height: 48px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
    }

    .edu-watermark img, .edu-watermark svg {
      max-width: 40px;
      max-height: 36px;
      object-fit: contain;
    }

    .edu-watermark .glyph, .edu-watermark .glyph-cjk { color: #19212c; font-size: 26px; }

    .award-list { margin: 0; padding: 0; list-style: none; }
    .award { padding-block: 16px; }
    .award .t { font-size: 15px; }

    .contact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }

    .contact-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 0;
      border-top: 1px solid var(--rule);
    }

    .contact-cell .label { color: var(--ink-mute); font-size: 13px; }
    .contact-cell .value { color: var(--ink); font-size: 15px; overflow-wrap: anywhere; }
    .contact-cell .arrow { color: var(--accent); margin-inline-start: 4px; }
    .contact-cell:hover .value { color: var(--accent); }

    .colophon {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 16px;
      margin-top: 64px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      color: var(--ink-mute);
      font-size: 12px;
    }

    .colophon-updated { display: none; }

    @media (max-width: 920px) {
      :root { --page-gutter: 24px; }

      .page {
        grid-template-columns: minmax(0, 1fr);
        gap: 32px;
        padding-top: var(--controls-clearance);
        padding-bottom: 64px;
      }

      .rail {
        position: static;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--rule);
      }

      .rail .language-switch { align-self: center; justify-self: end; }
      .rail-contents { grid-column: 1 / -1; }
      .rail-contents .rail-block-label, .rail-elsewhere, .rail-updated { display: none; }
      .rail-nav { flex-direction: row; flex-wrap: wrap; gap: 0 16px; }
      .rail-nav a { padding-block: 8px; }
      .colophon-updated { display: inline; }
    }

    @media (max-width: 640px) {
      .s-body p.lead { font-size: 16px; }
      section.s { margin-top: 48px; padding-top: 24px; }

      .research-cell,
      .pub,
      .exp,
      .award,
      .proj {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .pub-meta .y { display: inline; margin-inline-end: 8px; }
      .proj { gap: 16px; }
      .proj-anim { height: 144px; }
      .edu { grid-template-columns: minmax(0, 1fr) 48px; gap: 4px 16px; }
      .edu .exp-when, .edu .exp-body { grid-column: 1; }
      .edu-watermark { grid-column: 2; grid-row: 1 / span 2; width: 48px; height: 44px; }
      .contact-grid { grid-template-columns: minmax(0, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .proj-svg * { animation: none !important; }
    }
  </style>
</head>
